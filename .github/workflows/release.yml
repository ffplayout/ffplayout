name: Release

on:
  release:
    types: [released, prereleased]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.variant }}${{ matrix.distribution && format('-{0}', matrix.distribution) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: x86_64-unknown-linux-gnu
            variant: server
            features: embed_frontend
            deb_arch: amd64
            rpm_arch: x86_64
            distribution: deb13
            build_image: rust:slim-trixie
            runtime_image: debian:trixie
          - os: ubuntu-26.04
            platform: x86_64-unknown-linux-gnu
            variant: server
            features: embed_frontend
            deb_arch: amd64
            distribution: ubuntu26.04
            build_image: ubuntu:26.04
            runtime_image: ubuntu:26.04
          - os: ubuntu-26.04
            platform: x86_64-unknown-linux-gnu
            variant: desktop
            features: embed_frontend,desktop
          - os: ubuntu-26.04-arm
            platform: aarch64-unknown-linux-gnu
            variant: server
            features: embed_frontend
            deb_arch: arm64
            rpm_arch: aarch64
            distribution: deb13
            build_image: rust:slim-trixie
            runtime_image: debian:trixie
          - os: ubuntu-26.04-arm
            platform: aarch64-unknown-linux-gnu
            variant: server
            features: embed_frontend
            deb_arch: arm64
            distribution: ubuntu26.04
            build_image: ubuntu:26.04
            runtime_image: ubuntu:26.04
          - os: ubuntu-26.04-arm
            platform: aarch64-unknown-linux-gnu
            variant: desktop
            features: embed_frontend,desktop
          - os: macos-15-intel
            platform: x86_64-apple-darwin
            variant: desktop
            features: embed_frontend,desktop
          - os: macos-15
            platform: aarch64-apple-darwin
            variant: desktop
            features: embed_frontend,desktop
          - os: windows-latest
            platform: x86_64-pc-windows-msvc
            variant: desktop
            features: embed_frontend,desktop
    runs-on: ${{ matrix.os }}

    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      MACOS_ARCHIVE: ffplayout-${{ github.ref_name }}_${{ matrix.variant }}_${{ matrix.platform }}.zip

    steps:
      - uses: actions/checkout@v6

      - name: Validate macOS signing settings
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ISSUER_ID: ${{ vars.APPLE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh check

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        run: |
          rustup update stable

      - name: Set macOS Rust flags
        if: runner.os == 'macOS'
        run: echo 'RUSTFLAGS=-Csplit-debuginfo=packed' >> $GITHUB_ENV

      - name: Install build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          packages=(
            ffmpeg
            libavcodec-dev
            libavdevice-dev
            libavfilter-dev
            libavformat-dev
            libavutil-dev
            libswresample-dev
            libswscale-dev
            pandoc
            pkg-config
            rpm
          )
          if [[ "${{ matrix.variant }}" == "desktop" ]]; then
            packages+=(libasound2-dev)
          fi
          sudo apt-get install -y "${packages[@]}"
          ffmpeg -version
          test "$(pkg-config --modversion libavformat | cut -d. -f1)" -ge 61

      - name: Install build dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          packages=(ffmpeg pkg-config)
          brew install "${packages[@]}"
          brew_prefix="$(brew --prefix)"
          {
            echo "PKG_CONFIG_PATH=${brew_prefix}/lib/pkgconfig:${brew_prefix}/opt/ffmpeg/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "LIBRARY_PATH=${brew_prefix}/lib:${brew_prefix}/opt/ffmpeg/lib:${LIBRARY_PATH:-}"
            echo "DYLD_FALLBACK_LIBRARY_PATH=${brew_prefix}/lib:${brew_prefix}/opt/ffmpeg/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Download FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegName = "ffmpeg-n9.0-latest-win64-gpl-shared-9.0"
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP "$ffmpegName.zip"
          $ffmpegDir = Join-Path $env:RUNNER_TEMP $ffmpegName
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$ffmpegName.zip"

          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegArchive
          Expand-Archive -Path $ffmpegArchive -DestinationPath $env:RUNNER_TEMP

          if (!(Test-Path "$ffmpegDir\include") -or
              !(Test-Path "$ffmpegDir\lib") -or
              !(Test-Path "$ffmpegDir\bin")) {
            throw "Downloaded FFmpeg archive has an unexpected structure"
          }

          echo "FFMPEG_DIR=$ffmpegDir" >> $env:GITHUB_ENV
          echo "$ffmpegDir\bin" >> $env:GITHUB_PATH

      - name: Install frontend dependencies
        run: npm ci

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          ./scripts/man_create.sh
          # Keep the output directory owned by the runner, even when the
          # package files are produced by root inside the build container.
          mkdir -p dist
          if [[ "${{ matrix.variant }}" == "server" ]]; then
            docker run --rm -v "$PWD:/src" -w /src \
              -e GITHUB_REF_NAME -e CARGO_BUILD_JOBS \
              -e RPM_ARCH="${{ matrix.rpm_arch }}" \
              "${{ matrix.build_image }}" bash scripts/release-linux.sh
            source scripts/lib/deb-package.sh
            package_version=$(deb_package_version "$GITHUB_REF_NAME" "${{ matrix.distribution }}")
            bash scripts/test-deb-install.sh \
              "dist/ffplayout_${package_version}_${{ matrix.deb_arch }}.deb" \
              docker "${{ matrix.runtime_image }}"
          else
            cargo build --release --no-default-features --features "${{ matrix.features }}"
          fi
          archive_suffix=""
          if [[ -n "${{ matrix.distribution }}" ]]; then
            archive_suffix="_${{ matrix.distribution }}"
          fi
          tar --transform 's#^target/release/##' \
            -czf "dist/ffplayout-${{ github.ref_name }}_${{ matrix.variant }}_${{ matrix.platform }}${archive_suffix}.tar.gz" \
            --exclude='*.db' \
            --exclude='*.db-shm' \
            --exclude='*.db-wal' \
            assets docker docs migrations LICENSE README.md target/release/ffplayout

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          cargo build --release --no-default-features --features "${{ matrix.features }}"

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh sign target/release/ffplayout

      - name: Package on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/ffplayout .
          trap 'rm -f ffplayout' EXIT
          zip -r "dist/$MACOS_ARCHIVE" \
            assets docker docs migrations LICENSE README.md ffplayout \
            -x '*.db' '*.db-shm' '*.db-wal' '*.service'

      - name: Notarize macOS release archive
        if: runner.os == 'macOS'
        timeout-minutes: 300
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ISSUER_ID: ${{ vars.APPLE_ISSUER_ID }}
        run: bash scripts/sign-macos.sh notarize "dist/$MACOS_ARCHIVE"

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --no-default-features --features "${{ matrix.features }}"
          New-Item -ItemType Directory -Force -Path dist, package, package\bin | Out-Null
          Copy-Item target\release\ffplayout.exe package\bin\
          Copy-Item assets package\assets -Recurse
          Copy-Item docker package\docker -Recurse
          Copy-Item docs package\docs -Recurse
          Copy-Item migrations package\migrations -Recurse
          Copy-Item LICENSE, README.md package\
          Get-ChildItem package\assets -Include *.db,*.db-shm,*.db-wal,*.service -Recurse | Remove-Item -Force
          Compress-Archive -Path package\* -DestinationPath "dist\ffplayout-${{ github.ref_name }}_${{ matrix.variant }}_${{ matrix.platform }}.zip"

      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/ffplayout*
          tag: ${{ github.ref_name }}
          overwrite: true
          file_glob: true
