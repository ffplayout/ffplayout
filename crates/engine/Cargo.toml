[package]
name = "ff-engine"
description = "FFmpeg-based real-time playout library"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["desktop"]
desktop-base = ["dep:cpal", "dep:winit", "dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
desktop-gpu = ["desktop-base", "dep:bytemuck", "dep:pollster", "dep:wgpu"]
desktop = ["desktop-gpu"]
# Cargo features are additive; when both renderers are enabled, desktop-gpu takes precedence.
desktop-cpu = ["desktop-base", "dep:softbuffer"]
processing-bench = []
tokio = ["dep:tokio"]
ffmpeg-filter = ["ffmpeg-next/filter"]
ffmpeg-device = ["ffmpeg-next/device"]
transcription-example = ["dep:transcribe-rs", "dep:ort"]

[dependencies]
ff-graphics = { path = "../graphics", features = ["ffmpeg"] }
anyhow = "1"
bytemuck = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
cpal = { version = "0.18", optional = true }
ebur128-stream = "=0.2.0"
ffmpeg-next = { version = "9", default-features = false, features = [
    "format",
    "software-resampling",
    "software-scaling",
] }
log = { version = "0.4", features = ["kv"] }
pollster = { version = "1.0", optional = true }
regex = "1"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "x11",
    "x11-dlopen",
] }
tokio = { version = "1.44", optional = true, features = ["rt", "sync"] }
winit = { version = "0.30", optional = true }
transcribe-rs = { version = "0.3", optional = true, features = ["onnx", "whisper-cpp"] }
# transcribe-rs 0.3 uses the rc.12 API; later ORT prereleases changed Session::builder.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
wgpu = { version = "30.0", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0", optional = true, default-features = false, features = ["std", "parking_lot", "dx12", "gles", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true, default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSBezierPath", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation", "block2", "NSBitmapImageRep", "NSImageRep", "NSColor"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSData", "NSObject"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "30.0", optional = true, default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30.0", optional = true, default-features = false, features = ["std", "parking_lot", "gles", "wgsl"] }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
glob = "0.3"
naga = { version = "30.0", features = ["wgsl-in"] }

[build-dependencies]
pkg-config = "0.3"

[[example]]
name = "wav_cpal"
required-features = ["desktop-base"]

[[example]]
name = "live_transcription"
required-features = ["desktop-base", "transcription-example"]

[[bench]]
name = "audio_dynamics"
harness = false
